[package]
name = "file-studio"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.88"
description = "File inspection and integrity"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
localwright-core = { git = "https://github.com/ahmad-v/localwright", rev = "3091d10892df79b9959f49a073db34cf81c9a15e", version = "=0.1.0" }
localwright-ui = { git = "https://github.com/ahmad-v/localwright", rev = "3091d10892df79b9959f49a073db34cf81c9a15e", version = "=0.1.0", optional = true }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.8"
blake3 = "=1.8.1"
csv = "=1.3.1"
crc32fast = "=1.5.6"
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }


[features]
default = ["gui"]
gui = ["dep:localwright-ui"]

[dev-dependencies]
tempfile = "=3.19.1"
