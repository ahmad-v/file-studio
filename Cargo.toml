[package]
name = "file-studio"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.85"
description = "File inspection and integrity"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
localwright-core = { path = "../localwright/crates/localwright-core", version = "=0.1.0-alpha.1" }
localwright-ui = { path = "../localwright/crates/localwright-ui", version = "=0.1.0-alpha.1", optional = true }
serde_json = "=1.0.140"
sha2 = "=0.10.8"
blake3 = "=1.8.1"
csv = "=1.3.1"


[features]
default = ["gui"]
gui = ["dep:localwright-ui"]

[dev-dependencies]
tempfile = "=3.19.1"
