[package]
name = "file-studio"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.89"
description = "File inspection and integrity"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
age = { version = "=0.11.5", default-features = false }
file-id = "=0.2.3"
localwright-core = { git = "https://github.com/ahmad-v/localwright", rev = "6c73d43a419189c276623c3b083f7ffb208c24a6", version = "=0.1.0" }
localwright-ui = { git = "https://github.com/ahmad-v/localwright", rev = "6c73d43a419189c276623c3b083f7ffb208c24a6", version = "=0.1.0", optional = true }
iced = { version = "=0.13.1", default-features = false, features = ["tiny-skia", "fira-sans", "async-std"], optional = true }
futures = { version = "=0.3.31", optional = true }
rfd = { version = "=0.15.4", default-features = false, features = ["async-std", "xdg-portal"], optional = true }
serde = { version = "=1.0.221", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.9"
blake3 = "=1.8.1"
csv = "=1.3.1"
rusqlite = { version = "=0.43.0", default-features = false, features = ["bundled", "hooks", "limits"] }
tempfile = "=3.19.1"
crc32fast = "=1.5.6"
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }


[features]
default = ["gui"]
gui = ["dep:localwright-ui", "dep:iced", "dep:futures", "dep:rfd"]
