name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify changed files
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$PUSH_BEFORE_SHA"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rust=false
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            if [[ "$path" != *.md ]]; then
              rust=true
              break
            fi
          done < <(git diff --name-only "$base" "$HEAD_SHA")
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "Rust validation required: $rust"
      - name: Install Linux build prerequisites
        if: steps.scope.outputs.rust == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - name: Cache Cargo registry, Git sources and target
        if: steps.scope.outputs.rust == 'true'
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-rust1.88-default-gui-dev-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-rust1.88-default-gui-dev-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-
      - name: Verify formatting, locked build, tests and lint
        if: steps.scope.outputs.rust == 'true'
        run: |
          cargo --version
          cargo fmt --all -- --check
          cargo metadata --locked --format-version 1 --no-deps > /dev/null
          cargo check --locked --all-targets
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - name: Validate capability and packaging registries
        run: |
          python3 -m json.tool docs/capabilities.json > /dev/null
          python3 -m json.tool packaging/config.json > /dev/null
      - name: Check patch whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          base="$PUSH_BEFORE_SHA"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then base="$PR_BASE_SHA"; fi
          if [[ -n "$base" && ! "$base" =~ ^0+$ ]]; then
            git diff --check "$base" "$HEAD_SHA"
          else
            git diff --check
          fi
