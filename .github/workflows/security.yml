name: Security and dependency review

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: RustSec dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Cache Cargo registry and pinned audit tool
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
          key: cargo-ubuntu-24.04-X64-security-audit-rust1.88-cargo-audit-0.23.0-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}
      - name: Install pinned cargo-audit when cache is cold
        run: |
          if ! command -v cargo-audit >/dev/null 2>&1; then
            cargo install --locked --version 0.23.0 cargo-audit
          fi
      - name: Audit locked dependencies against current RustSec advisories
        run: cargo audit --file Cargo.lock

  sbom-and-license-inventory:
    name: CycloneDX SBOM and license inventory
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - name: Cache Cargo sources, target and pinned SBOM tool
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/bin/cargo-cyclonedx
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
            target
          key: cargo-ubuntu-24.04-X64-x86_64-unknown-linux-gnu-security-sbom-rust1.88-default-gui-debug-cyclonedx-0.5.10-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            cargo-ubuntu-24.04-X64-x86_64-unknown-linux-gnu-security-sbom-rust1.88-default-gui-debug-cyclonedx-0.5.10-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-
      - name: Install pinned CycloneDX generator when cache is cold
        run: |
          if ! command -v cargo-cyclonedx >/dev/null 2>&1; then
            cargo install --locked --version 0.5.10 cargo-cyclonedx
          fi
      - name: Generate default-feature CycloneDX SBOM
        run: |
          cargo cyclonedx \
            --format json \
            --target x86_64-unknown-linux-gnu \
            --override-filename file-studio-sbom
          python3 -m json.tool file-studio-sbom.json > /dev/null
      - name: Generate dependency license and notice inventory
        run: |
          cargo build --locked
          python3 - <<'PY'
          from importlib.util import module_from_spec, spec_from_file_location
          from pathlib import Path
          import json

          root = Path.cwd()
          module_spec = spec_from_file_location(
              "dependency_notices", root / "packaging" / "dependency_notices.py"
          )
          module = module_from_spec(module_spec)
          module_spec.loader.exec_module(module)
          destination = root / "dist" / "dependency-license-inventory"
          destination.mkdir(parents=True)
          module.collect(
              root,
              destination,
              "x86_64-unknown-linux-gnu",
              root / "target" / "debug" / "file-studio",
          )
          report = json.loads(
              (destination / "DEPENDENCY_LICENSES.json").read_text(encoding="utf-8")
          )
          print(f"Inventoried {len(report['packages'])} default-feature dependencies")
          missing = [
              f"{item['name']} {item['version']}"
              for item in report["packages"]
              if not item["declared_license"] or not item["notice_files"]
          ]
          if missing:
              print("Review required for dependencies without a declared license or bundled notice:")
              print("\n".join(missing))
          (destination / "LICENSE_REVIEW_REQUIRED.txt").write_text(
              "This generated inventory is evidence, not an approval of third-party licenses. "
              "Review every declared license, supplemental source, native asset, and model "
              "before distribution.\n",
              encoding="utf-8",
          )
          PY
      - name: Upload dependency review evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: file-studio-dependency-review-${{ github.sha }}
          path: |
            file-studio-sbom.json
            dist/dependency-license-inventory/
          if-no-files-found: error
          retention-days: 30
